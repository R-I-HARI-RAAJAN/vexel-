<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vexel — Your next customer starts with a hello.</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#01061a">
<script>
(function () {
  var d = document.documentElement;
  try {
    if (window.Element && Element.prototype.animate && window.matchMedia &&
        !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      d.classList.add('intro');
      window.__vexelGuard = setTimeout(function () { d.classList.remove('intro'); }, 3500);
    }
  } catch (e) {}
})();
</script>
<style>
@font-face{font-family:"Google Sans";font-weight:400;font-style:normal;font-display:block;src:url("assets/google-sans-400.woff2") format("woff2")}
@font-face{font-family:"Google Sans";font-weight:500;font-style:normal;font-display:block;src:url("assets/google-sans-500.woff2") format("woff2")}

:root{
  --ink:#ffffff;
  --nav:rgba(238,242,255,.9);
  --sub:rgba(226,233,255,.74);
  --link:rgba(212,236,255,.77);
  --hair:rgba(255,255,255,.19);
  --btn:#ffffff;
  --btn-ink:#0a0a0a;
  --u:min(calc(100vh / 800), max(calc(100vw / 1280), min(calc(100vw / 640), .75px)));
}
@supports (height:100dvh){
  :root{--u:min(calc(100dvh / 800), max(calc(100vw / 1280), min(calc(100vw / 640), .75px)))}
}

*,*::before,*::after{box-sizing:border-box}
html{
  background-color:#01061a;
  background-image:linear-gradient(90deg,#00061a 0%,#01071b 22%,#01071a 45%,#010718 62%,#010614 80%,#020511 100%);
  height:100%;
}
body{
  margin:0;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  color:var(--ink);
  background:transparent;
  font-family:"Google Sans","Product Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision;
  font-kerning:normal;
}
a{color:inherit;text-decoration:none}
a:focus{outline:none}
button:focus{outline:none}

.page{
  position:relative;
  height:100%;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding-top:calc(env(safe-area-inset-top, 0px) + 40.5 * var(--u));
  overflow:hidden;
}

.masthead{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  flex:none;
}
.logo{
  display:block;
  position:relative;
  left:calc(-.5 * var(--u));
  line-height:0;
}
.logo svg{
  display:block;
  height:max(calc(23.5 * var(--u)), 17px);
  aspect-ratio:103.5 / 23.5;
  width:auto;
  fill:#fff;
}
.rule{
  width:max(calc(284 * var(--u)), 252px);
  height:1px;
  margin-top:calc(24 * var(--u));
  background:var(--hair);
  transform-origin:50% 50%;
}
.nav{
  width:max(calc(284 * var(--u)), 252px);
  margin-top:calc(17.4 * var(--u));
  padding:0 calc(8.9 * var(--u));
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.nav a{
  font-size:max(calc(15 * var(--u)), 13px);
  letter-spacing:-.033em;
  color:var(--nav);
  line-height:1.2;
  transition:color .2s ease;
}
.nav a:hover{color:#fff}

.gap{
  flex:82.98 1 0;
  min-height:calc(24 * var(--u));
}

.copy{
  position:relative;
  z-index:2;
  flex:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 0;
}
.headline{
  margin:0;
  font-weight:400;
  font-size:max(calc(68 * var(--u)), 34px);
  line-height:.9559;
  letter-spacing:-.0279em;
  white-space:nowrap;
  color:var(--ink);
}
.headline .l{display:block;position:relative}
.headline .l + .l{letter-spacing:-.0294em;left:calc(2.6 * var(--u))}
.headline .li{display:block}

.sub{
  margin:calc(18.98 * var(--u)) 0 0;
  font-size:max(calc(21 * var(--u)), 15px);
  letter-spacing:-.005em;
  color:var(--sub);
  text-wrap:balance;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:max(calc(216 * var(--u)), 196px);
  height:max(calc(46 * var(--u)), 44px);
  border-radius:max(calc(4.5 * var(--u)), 4px);
  margin-top:calc(25.64 * var(--u));
  background:var(--btn);
  color:var(--btn-ink);
  font-weight:500;
  font-size:max(calc(17 * var(--u)), 15px);
  letter-spacing:-.0265em;
  transition:background-color .2s ease, box-shadow .2s ease;
}
.btn:hover{
  background:#e8eef7;
  box-shadow:0 0 0 calc(4 * var(--u)) rgba(120,200,255,.12);
}

.discover{
  display:inline-flex;
  align-items:center;
  gap:.45em;
  margin-top:calc(20.55 * var(--u));
  font-size:max(calc(14.8 * var(--u)), 13px);
  letter-spacing:-.051em;
  color:var(--link);
  transition:color .2s ease;
}
.discover:hover{color:#fff}
.discover svg{
  display:block;
  width:.68em;
  height:.85em;
  fill:none;
  stroke:currentColor;
  stroke-width:1.45;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:transform .25s ease;
}
.discover:hover svg{transform:translateY(.12em)}

.field{
  position:relative;
  z-index:0;
  flex:318.68 1 0;
  min-height:calc(160 * var(--u));
  width:100%;
  container-type:size;
  pointer-events:none;
}
.field video{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:auto;
  height:max(60vw, 105vh);
  height:max(calc(100cqw * 971 / 1619), calc((100cqh + 36.4 * var(--u)) / .49537 + 1px));
  max-width:none;
  pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 4%);
  mask-image:linear-gradient(to bottom, transparent 0, #000 4%);
}
@supports not (height:1cqw){
  .field video{height:max(60vw, 105vh)}
}

.logo:focus-visible,
.nav a:focus-visible,
.discover:focus-visible{outline:2px solid #7fd4ff;outline-offset:4px}
.btn:focus-visible{outline:2px solid #7fd4ff;outline-offset:3px}

/* Intro initial states */
.intro .logo,
.intro .nav a,
.intro .sub,
.intro .btn,
.intro .discover{opacity:0}
.intro .rule{transform:scaleX(0)}
.intro .headline .l{clip-path:inset(-10% -6% 12% -6%)}
.intro .headline .li{transform:translateY(104%)}

/* Tablet */
@media (min-width:600px) and (max-width:1099.98px) and (min-height:541px){
  :root{--u:min(calc(100vh / 800), 1px, max(calc(100vw / 1280), calc(100vh / 1190), .86px))}
  @supports (height:100dvh){
    :root{--u:min(calc(100dvh / 800), 1px, max(calc(100vw / 1280), calc(100dvh / 1190), .86px))}
  }
  .field{max-height:48vh;max-height:48dvh}
  .nav a{padding:14px 8px;margin:-14px -8px}
  .discover{padding:12px 10px;margin-top:calc(20.55 * var(--u) - 12px);margin-bottom:-12px;margin-left:-10px;margin-right:-10px}
}

/* Portrait phones */
@media (max-width:599.98px) and (orientation:portrait){
  :root{--u:min(calc(100vh / 800), max(calc(100vw / 1280), min(calc(100vw / 640), .75px)))}
  @supports (height:100svh){
    :root{--u:min(calc(100svh / 800), max(calc(100vw / 1280), min(calc(100vw / 640), .75px)))}
  }
  .copy{padding:0 24px}
  .headline{white-space:nowrap;font-size:max(26px, min(calc(68 * var(--u)), calc((100vw - 48px) / 8.235)))}
  .sub{font-size:max(16px, min(calc(21 * var(--u)), 3.345vw));line-height:1.25;overflow-wrap:break-word}
  .rule,.nav{width:min(max(calc(284 * var(--u)), 252px), calc(100vw - 32px))}
  .field{max-height:48%}
  .nav a{padding:14px 8px;margin:-14px -8px}
  .discover{padding:12px 10px;margin-top:calc(20.55 * var(--u) - 12px);margin-bottom:-12px;margin-left:-10px;margin-right:-10px}
}

/* Short landscape */
@media (orientation:landscape) and (max-height:539.98px){
  .logo svg{height:13px}
  .rule,.nav{width:210px}
  .nav a{font-size:11px}
  .headline{font-size:28px}
  .sub{font-size:12px}
  .btn{width:150px;height:34px;font-size:12.5px}
  .discover{font-size:11px}
  .gap{min-height:calc(14 * var(--u))}
  .field{min-height:calc(120 * var(--u))}
}
@media (orientation:landscape) and (max-height:539.98px) and (pointer:coarse){
  .nav a{padding:14px 8px;margin:-14px -8px}
  .discover{padding:12px 10px;margin-top:calc(20.55 * var(--u) - 12px);margin-bottom:-12px;margin-left:-10px;margin-right:-10px}
}

/* Very narrow, outside portrait block */
@media (max-width:359px) and (not (orientation:portrait)){
  .headline{white-space:normal;font-size:30px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<main class="page" id="page">
  <header class="masthead">
    <a class="logo" href="#" aria-label="Vexel home">
      <svg viewBox="588 40.5 103.5 23.5" role="img" aria-hidden="true" focusable="false">
        <path d="M588.6 40.8H594.9L601.4 56.6L606.5 40.8H612.6L604.2 63.5H597.8Z"/>
        <path d="M612.8 40.8H630.5V45.2H619.2V49.8H628.3V54.4H619.2V58.9H631.5V63.5H612.8Z"/>
        <path d="M631.3 40.8H637.9L642.5 47.4L646.5 40.8H653.1L646.4 52L653.6 63.5H647.1L642.5 56.4L638.3 63.5H631.4L638.8 52Z"/>
        <path d="M653.6 40.8H669.6V63.5H653.6V58.9H664.3V54.4H657V49.8H664.3V45.2H653.6Z"/>
        <path d="M672.4 40.8H677.6V58.9H690.5V63.5H672.4Z"/>
      </svg>
    </a>
    <div class="rule" aria-hidden="true"></div>
    <nav class="nav" aria-label="Primary">
      <a href="#platform">Platform</a>
      <a href="#company">Company</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <div class="gap" aria-hidden="true"></div>

  <section class="copy">
    <h1 class="headline">
      <span class="l"><span class="li">Your next customer</span></span>
      <span class="l"><span class="li">starts with a hello.</span></span>
    </h1>
    <p class="sub">Make&nbsp;the&nbsp;first&nbsp;move. We’ll&nbsp;help&nbsp;with&nbsp;what&nbsp;follows.</p>
    <a class="btn" href="#contact">Start a conversation</a>
    <a class="discover" href="#platform"><span>Discover the platform</span>
      <svg viewBox="0 0 11 12.6" aria-hidden="true" focusable="false"><path d="M5.5 .4V12M1 7.5L5.5 12L10 7.5"/></svg>
    </a>
  </section>

  <div class="field" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto" tabindex="-1" aria-hidden="true" disablepictureinpicture
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261005_182549_18378239-da8f-48a7-9666-d6e0a6a88561.mp4"></video>
  </div>
</main>

<script>
(function () {
  var root = document.documentElement;
  if (!root.classList.contains('intro')) return;

  var started = false;
  var page = document.getElementById('page');
  var video = document.querySelector('.field video');
  video.muted = true;
  var pp = video.play && video.play(); if (pp && pp.catch) pp.catch(function () {});

  function q(s) { return page.querySelector(s); }
  function qa(s) { return Array.prototype.slice.call(page.querySelectorAll(s)); }

  function start() {
    if (started) return;
    started = true;
    clearTimeout(window.__vexelGuard);

    var logo = q('.logo');
    var rule = q('.rule');
    var nav = qa('.nav a');
    var lis = qa('.headline .li');
    var sub = q('.sub');
    var btn = q('.btn');
    var disc = q('.discover');
    var arrow = q('.discover svg');

    var lh = q('.logo svg').getBoundingClientRect().height;
    var k = Math.min(1, Math.max(0.65, lh / 23.5));

    var quint = 'cubic-bezier(0.22, 1, 0.36, 1)';
    var expo = 'cubic-bezier(0.16, 1, 0.3, 1)';
    var anims = [];
    function go(el, kf, o) {
      o.fill = 'both';
      anims.push(el.animate(kf, o));
    }

    go(logo, [{ opacity: 0, transform: 'translateY(' + (-6 * k) + 'px)' }, { opacity: 1, transform: 'none' }],
      { delay: 60, duration: 900, easing: quint });
    go(rule, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }],
      { delay: 180, duration: 1000, easing: 'cubic-bezier(0.7, 0, 0.2, 1)' });
    nav.forEach(function (a, i) {
      go(a, [{ opacity: 0, transform: 'translateY(' + (-4 * k) + 'px)' }, { opacity: 1, transform: 'none' }],
        { delay: i === 1 ? 420 : 490, duration: 700, easing: quint });
    });
    lis.forEach(function (li, i) {
      go(li, [{ transform: 'translateY(104%)' }, { transform: 'none' }],
        { delay: i === 0 ? 200 : 290, duration: 1100, easing: expo });
    });
    go(sub, [{ opacity: 0, transform: 'translateY(' + (10 * k) + 'px)' }, { opacity: 1, transform: 'none' }],
      { delay: 700, duration: 850, easing: quint });
    go(btn, [{ opacity: 0, transform: 'translateY(' + (12 * k) + 'px) scale(0.975)' }, { opacity: 1, transform: 'none' }],
      { delay: 860, duration: 900, easing: expo });
    go(disc, [{ opacity: 0, transform: 'translateY(' + (6 * k) + 'px)' }, { opacity: 1, transform: 'none' }],
      { delay: 1040, duration: 700, easing: quint });
    go(arrow, [{ transform: 'translateY(' + (-5 * k) + 'px)' }, { transform: 'none' }],
      { delay: 1120, duration: 820, easing: expo });

    Promise.all(anims.map(function (a) { return a.finished; })).then(function () {
      root.classList.remove('intro');
      anims.forEach(function (a) { try { a.cancel(); } catch (e) {} });
      var ae = document.activeElement;
      if (!ae || ae === document.body || !page.contains(ae)) {
        page.style.display = 'none';
        void page.offsetHeight;
        page.style.display = '';
      }
      root.setAttribute('data-intro', 'done');
    }, function () {
      root.classList.remove('intro');
      root.setAttribute('data-intro', 'done');
    });
  }

  var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  var videoReady = new Promise(function (res) {
    if (video.readyState >= 2) return res();
    video.addEventListener('loadeddata', function () { res(); }, { once: true });
  });
  var cap = new Promise(function (res) { setTimeout(res, 900); });
  Promise.race([Promise.all([fontsReady, videoReady]), cap]).then(start, start);
})();
</script>
</body>
</html>
